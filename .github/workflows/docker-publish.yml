name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_KEY }}

      - name: Build image
        run: IMAGE=debdutdeb/velero-plugin-exclude-with-ownerref VERSION=main make container

      - name: Push image
        run: IMAGE=debdutdeb/velero-plugin-exclude-with-ownerref VERSION=main TAG_LATEST=true make push
